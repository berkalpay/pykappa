
    <!DOCTYPE html>
    <html>
    <head>
        <title>main performance log</title>
        <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            .plot-container { width: 100%; height: 600px; margin-bottom: 40px; }
            /* Change cursor to pointer for plot points */
            .cursor-pointer .nsewdrag, .cursor-pointer .nsewdrag drag {
                cursor: pointer !important;
            }
        </style>
    </head>
    <body>
        <h1>Performance log, branch <a href="https://github.com/berkalpay/pykappa/tree/main">main</a></h1>

        <div class="plot-container" id="runtimePlot"></div>

        <script>
            // Shared configuration
            const commitHashes = ["af1d0d99", "885f2154", "41c28fad", "383ed0f0"];
            const shortHashes = ["<a href=\"https://github.com/berkalpay/pykappa/commit/af1d0d99\">af1d0d9</a>", "<a href=\"https://github.com/berkalpay/pykappa/commit/885f2154\">885f215</a>", "<a href=\"https://github.com/berkalpay/pykappa/commit/41c28fad\">41c28fa</a>", "<a href=\"https://github.com/berkalpay/pykappa/commit/383ed0f0\">383ed0f</a>"];
            const plotConfig = {responsive: true};

            // Runtime data and plot
            const runtimeData = [{"x": ["af1d0d99", "885f2154", "41c28fad", "383ed0f0"], "y": [1.8653210429999945, 1.6985839740000301, 1.6853099289999989, 1.5637243439999935], "name": "heterodimerization_small", "mode": "lines+markers", "connectgaps": false, "text": ["af1d0d9", "885f215", "41c28fa", "383ed0f"], "customdata": ["2026_07_30_commit_af1d0d99/profile_heterodimerization_small_flamegraph.svg", "2026_07_30_commit_885f2154/profile_heterodimerization_small_flamegraph.svg", "2026_07_30_commit_41c28fad/profile_heterodimerization_small_flamegraph.svg", "2026_07_31_commit_383ed0f0/profile_heterodimerization_small_flamegraph.svg"], "hovertemplate": "<b>%{text}</b><br><b>Runtime: %{y:.4f}s</b><br>(Click to open flamegraph)", "marker": {"size": 12}}, {"x": ["af1d0d99", "885f2154", "41c28fad", "383ed0f0"], "y": [8.465582114, 8.548166454000011, 7.8058603660000045, 7.644515419000001], "name": "ktam", "mode": "lines+markers", "connectgaps": false, "text": ["af1d0d9", "885f215", "41c28fa", "383ed0f"], "customdata": ["2026_07_30_commit_af1d0d99/profile_ktam_flamegraph.svg", "2026_07_30_commit_885f2154/profile_ktam_flamegraph.svg", "2026_07_30_commit_41c28fad/profile_ktam_flamegraph.svg", "2026_07_31_commit_383ed0f0/profile_ktam_flamegraph.svg"], "hovertemplate": "<b>%{text}</b><br><b>Runtime: %{y:.4f}s</b><br>(Click to open flamegraph)", "marker": {"size": 12}}, {"x": ["af1d0d99", "885f2154", "41c28fad", "383ed0f0"], "y": [17.88030050600001, 18.763975804999973, 17.617413432999996, 17.165339906], "name": "uni_bi_small", "mode": "lines+markers", "connectgaps": false, "text": ["af1d0d9", "885f215", "41c28fa", "383ed0f"], "customdata": ["2026_07_30_commit_af1d0d99/profile_uni_bi_small_flamegraph.svg", "2026_07_30_commit_885f2154/profile_uni_bi_small_flamegraph.svg", "2026_07_30_commit_41c28fad/profile_uni_bi_small_flamegraph.svg", "2026_07_31_commit_383ed0f0/profile_uni_bi_small_flamegraph.svg"], "hovertemplate": "<b>%{text}</b><br><b>Runtime: %{y:.4f}s</b><br>(Click to open flamegraph)", "marker": {"size": 12}}];

            Plotly.newPlot('runtimePlot', runtimeData, {
                title: 'Runtime (seconds)',
                titlefont: { size: 30, weight: 'bold' },
                xaxis: {
                    title: 'Commit Hash',
                    type: 'category',
                    tickangle: -45,
                    tickmode: 'array',
                    tickvals: commitHashes,
                    ticktext: shortHashes,
                },
                yaxis: { title: 'Runtime (s)',
                        rangemode: 'tozero'},
                hovermode: 'closest',
                showlegend: true
            }, plotConfig);

            // Memory data and plot
            const memoryData = [{"x": ["af1d0d99", "885f2154", "41c28fad", "383ed0f0"], "y": [110.546875, 110.746094, 110.519531, 110.777344], "name": "heterodimerization_small", "mode": "lines+markers", "connectgaps": false, "text": ["af1d0d9", "885f215", "41c28fa", "383ed0f"], "customdata": ["2026_07_30_commit_af1d0d99/profile_heterodimerization_small_memplot.png", "2026_07_30_commit_885f2154/profile_heterodimerization_small_memplot.png", "2026_07_30_commit_41c28fad/profile_heterodimerization_small_memplot.png", "2026_07_31_commit_383ed0f0/profile_heterodimerization_small_memplot.png"], "hovertemplate": "<b>%{text}</b><br><b>Peak Memory: %{y:.2f} MB</b><br>(Click to open memory usage plot)", "marker": {"size": 12}}, {"x": ["af1d0d99", "885f2154", "41c28fad", "383ed0f0"], "y": [101.089844, 100.90625, 100.988281, 101.082031], "name": "ktam", "mode": "lines+markers", "connectgaps": false, "text": ["af1d0d9", "885f215", "41c28fa", "383ed0f"], "customdata": ["2026_07_30_commit_af1d0d99/profile_ktam_memplot.png", "2026_07_30_commit_885f2154/profile_ktam_memplot.png", "2026_07_30_commit_41c28fad/profile_ktam_memplot.png", "2026_07_31_commit_383ed0f0/profile_ktam_memplot.png"], "hovertemplate": "<b>%{text}</b><br><b>Peak Memory: %{y:.2f} MB</b><br>(Click to open memory usage plot)", "marker": {"size": 12}}, {"x": ["af1d0d99", "885f2154", "41c28fad", "383ed0f0"], "y": [103.105469, 103.027344, 103.128906, 102.984375], "name": "uni_bi_small", "mode": "lines+markers", "connectgaps": false, "text": ["af1d0d9", "885f215", "41c28fa", "383ed0f"], "customdata": ["2026_07_30_commit_af1d0d99/profile_uni_bi_small_memplot.png", "2026_07_30_commit_885f2154/profile_uni_bi_small_memplot.png", "2026_07_30_commit_41c28fad/profile_uni_bi_small_memplot.png", "2026_07_31_commit_383ed0f0/profile_uni_bi_small_memplot.png"], "hovertemplate": "<b>%{text}</b><br><b>Peak Memory: %{y:.2f} MB</b><br>(Click to open memory usage plot)", "marker": {"size": 12}}];
            memoryData.forEach(trace => trace.marker = {size: 12});

            Plotly.newPlot('memoryPlot', memoryData, {
                title: 'Peak Memory Usage (MB)',
                titlefont: { size: 30, weight: 'bold' },
                xaxis: {
                    title: 'Commit Hash',
                    type: 'category',
                    tickangle: -45,
                    tickmode: 'array',
                    tickvals: commitHashes,
                    ticktext: shortHashes,
                },
                yaxis: { title: 'Peak Memory (MB)',
                        rangemode: 'tozero'},
                hovermode: 'closest',
                showlegend: true
            }, plotConfig);

            ['runtimePlot', 'memoryPlot'].forEach(plotId => {
                const plot = document.getElementById(plotId);

                // Change cursor on hover
                plot.on('plotly_hover', function(data) {
                    plot.classList.add('cursor-pointer');
                });

                // Revert cursor when not hovering
                plot.on('plotly_unhover', function(data) {
                    plot.classList.remove('cursor-pointer');
                });

                // Click handler
                plot.on('plotly_click', function(data) {
                    const url = data.points[0].customdata;
                    if (url) window.open(url, '_blank');
                });
            });
        </script>
    </body>
    </html>
